name: Build & Smoke Test

on:
  pull_request:
    branches: [main]
    paths:
      - "claude-terminal/**"
      - "codewhale-terminal/**"
      - ".github/workflows/build-test.yml"

jobs:
  lint:
    name: Lint Claude Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: claude-terminal/Dockerfile
          failure-threshold: error
          # HA add-ons use BUILD_FROM arg for base image and Alpine rolling packages
          ignore: DL3006,DL3018

  lint-codewhale:
    name: Lint Codewhale Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: codewhale-terminal/Dockerfile
          failure-threshold: error
          # DL3006: HA add-ons use the BUILD_FROM arg for the base image.
          # DL3008: apt versions are intentionally unpinned (rolling Ubuntu base);
          # the Codewhale release IS pinned via the CODEWHALE_VERSION build arg.
          ignore: DL3006,DL3008

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            build_from: ghcr.io/home-assistant/amd64-base:3.21
          - arch: aarch64
            build_from: ghcr.io/home-assistant/aarch64-base:3.21
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: ./claude-terminal
          push: false
          # --load only works for native arch; cross-arch just verifies build succeeds
          load: ${{ matrix.arch == 'amd64' }}
          platforms: ${{ matrix.arch == 'amd64' && 'linux/amd64' || 'linux/arm64' }}
          tags: test/claude-terminal:${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}

      - name: Smoke test — image is runnable
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm --entrypoint /bin/bash \
            test/claude-terminal:amd64 -c "echo 'Image runs OK'"

      - name: Smoke test — scripts are executable
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm --entrypoint /bin/bash \
            test/claude-terminal:amd64 -c '
              for script in \
                /run.sh \
                /opt/scripts/setup-ha-mcp.sh \
                /opt/scripts/health-check.sh \
                /opt/scripts/persist-install.sh \
                /opt/scripts/ha-context.sh \
                /opt/scripts/welcome.sh; do
                if [ ! -x "$script" ]; then
                  echo "FAIL: $script is not executable"
                  exit 1
                fi
                echo "OK: $script"
              done
            '

      - name: Smoke test — key binaries available
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm --entrypoint /bin/bash \
            test/claude-terminal:amd64 -c '
              for bin in node npm claude git tmux ttyd jq curl uv; do
                if ! which "$bin" > /dev/null 2>&1; then
                  echo "FAIL: $bin not found"
                  exit 1
                fi
                echo "OK: $bin"
              done
            '

  build-codewhale:
    name: Build Codewhale (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            build_from: ubuntu:24.04
          - arch: aarch64
            build_from: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: ./codewhale-terminal
          push: false
          # --load only works for native arch; cross-arch just verifies build succeeds
          load: ${{ matrix.arch == 'amd64' }}
          platforms: ${{ matrix.arch == 'amd64' && 'linux/amd64' || 'linux/arm64' }}
          tags: test/codewhale-terminal:${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}

      - name: Smoke test — image is runnable
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm --entrypoint /bin/bash \
            test/codewhale-terminal:amd64 -c "echo 'Image runs OK'"

      - name: Smoke test — scripts are executable
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm --entrypoint /bin/bash \
            test/codewhale-terminal:amd64 -c '
              for script in \
                /run.sh \
                /opt/scripts/codewhale-config.sh \
                /opt/scripts/setup-ha-mcp.sh \
                /opt/scripts/health-check.sh \
                /opt/scripts/persist-install.sh \
                /opt/scripts/ha-context.sh \
                /opt/scripts/reconfigure.sh \
                /opt/scripts/welcome.sh; do
                if [ ! -x "$script" ]; then
                  echo "FAIL: $script is not executable"
                  exit 1
                fi
                echo "OK: $script"
              done
            '

      - name: Smoke test — key binaries available
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm --entrypoint /bin/bash \
            test/codewhale-terminal:amd64 -c '
              for bin in codewhale codewhale-tui git tmux ttyd jq curl uv; do
                if ! which "$bin" > /dev/null 2>&1; then
                  echo "FAIL: $bin not found"
                  exit 1
                fi
                echo "OK: $bin"
              done
            '

      - name: Smoke test — Codewhale runs
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm --entrypoint /bin/bash \
            test/codewhale-terminal:amd64 -c '
              codewhale --version
              codewhale-tui --version
            '
